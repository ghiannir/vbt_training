; Sensore VBT su M5Stack StickS3 (ESP32-S3-PICO-1-N8R8)
; Non esiste ancora una scheda "StickS3" in PlatformIO: si usa la StampS3
; (stesso ESP32-S3 con 8 MB di flash) e si attiva a mano la PSRAM, che sul
; PICO-1-N8R8 e' octal (qio_opi).

[env:m5sticks3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    m5stack/M5Unified@^0.2.27
    h2zero/NimBLE-Arduino@^2.3.0
monitor_speed = 115200
