; VBT sensor on M5Stack StickS3 (ESP32-S3-PICO-1-N8R8)
; PlatformIO has no "StickS3" board yet: we use the StampS3
; (same ESP32-S3 with 8 MB of flash) and enable PSRAM by hand; on the
; PICO-1-N8R8 it is octal (qio_opi).

[env:m5sticks3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    m5stack/M5Unified@^0.2.27
    h2zero/NimBLE-Arduino@^2.3.0
monitor_speed = 115200
; the monitor must not toggle DTR/RTS: on the ESP32-S3 they can leave the chip in the bootloader (black screen)
monitor_dtr = 0
monitor_rts = 0
